<text x="1248" y="31" text-anchor="end" class="mono" font-size="12" fill="#5E7479">Build Succeeded</text><text x="56" y="96" text-anchor="end" class="mono" font-size="13" fill="#5E7479">1</text><text x="80" y="96" class="mono" font-size="17" xml:space="preserve"><tspan fill="#FF7AB2">struct </tspan><tspan fill="#5DD8FF">Karthik</tspan><tspan fill="#E8EFEF">: </tspan><tspan fill="#5DD8FF">Engineer</tspan><tspan fill="#E8EFEF"> {</tspan></text><text x="56" y="125" text-anchor="end" class="mono" font-size="13" fill="#5E7479">2</text><text x="80" y="125" class="mono" font-size="17" xml:space="preserve"><tspan fill="#FF7AB2">    let </tspan><tspan fill="#E8EFEF">platforms</tspan><tspan fill="#E8EFEF">: [</tspan><tspan fill="#5DD8FF">Platform</tspan><tspan fill="#E8EFEF">] = [</tspan><tspan fill="#A7EBDD">.iOS</tspan><tspan fill="#E8EFEF">, </tspan><tspan fill="#A7EBDD">.android</tspan><tspan fill="#E8EFEF">, </tspan><tspan fill="#A7EBDD">.web</tspan><tspan fill="#E8EFEF">]</tspan></text><text x="56" y="154" text-anchor="end" class="mono" font-size="13" fill="#5E7479">3</text><text x="80" y="154" class="mono" font-size="17" xml:space="preserve"><tspan fill="#FF7AB2">    let </tspan><tspan fill="#E8EFEF">habit</tspan><tspan fill="#E8EFEF"> = </tspan><tspan fill="#FF8170">&quot;Understand the why, then build the how&quot;</tspan></text><text x="56" y="183" text-anchor="end" class="mono" font-size="13" fill="#5E7479">4</text><text x="80" y="183" class="mono" font-size="17" xml:space="preserve"><tspan fill="#E8EFEF"></tspan></text><text x="56" y="212" text-anchor="end" class="mono" font-size="13" fill="#5E7479">5</text><text x="80" y="212" class="mono" font-size="17" xml:space="preserve"><tspan fill="#FF7AB2">    func </tspan><tspan fill="#A7EBDD">build</tspan><tspan fill="#E8EFEF">(_ idea: </tspan><tspan fill="#5DD8FF">Idea</tspan><tspan fill="#E8EFEF">) </tspan><tspan fill="#FF7AB2">async throws</tspan><tspan fill="#E8EFEF"> -&gt; </tspan><tspan fill="#5DD8FF">App</tspan><tspan fill="#E8EFEF"> {</tspan></text><text x="56" y="241" text-anchor="end" class="mono" font-size="13" fill="#5E7479">6</text><text x="80" y="241" class="mono" font-size="17" xml:space="preserve"><tspan fill="#FF7AB2">        let </tspan><tspan fill="#E8EFEF">schema</tspan><tspan fill="#E8EFEF"> = </tspan><tspan fill="#FF7AB2">try await </tspan><tspan fill="#5DD8FF">Backend</tspan><tspan fill="#E8EFEF">.design(for: idea)</tspan><tspan fill="#7F8C98">   // data first</tspan></text><text x="56" y="270" text-anchor="end" class="mono" font-size="13" fill="#5E7479">7</text><text x="80" y="270" class="mono" font-size="17" xml:space="preserve"><tspan fill="#FF7AB2">        let </tspan><tspan fill="#E8EFEF">screens</tspan><tspan fill="#E8EFEF"> = </tspan><tspan fill="#5DD8FF">Interface</tspan><tspan fill="#E8EFEF">.design(for: idea)</tspan><tspan fill="#7F8C98">       // then the experience</tspan></text><text x="56" y="299" text-anchor="end" class="mono" font-size="13" fill="#5E7479">8</text><text x="80" y="299" class="mono" font-size="17" xml:space="preserve"><tspan fill="#FF7AB2">        return </tspan><tspan fill="#5DD8FF">App</tspan><tspan fill="#E8EFEF">(ui: screens, api: schema, architecture: </tspan><tspan fill="#A7EBDD">.clean</tspan><tspan fill="#E8EFEF">)</tspan></text><text x="56" y="328" text-anchor="end" class="mono" font-size="13" fill="#5E7479">9</text><text x="80" y="328" class="mono" font-size="17" xml:space="preserve"><tspan fill="#E8EFEF">    }</tspan></text><text x="56" y="357" text-anchor="end" class="mono" font-size="13" fill="#5E7479">10</text><text x="80" y="357" class="mono" font-size="17" xml:space="preserve"><tspan fill="#E8EFEF">}</tspan></text><rect x="93" y="337" width="2" height="21" fill="#E8EFEF"><animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/></rect>
