<text x="36" y="190" class="sans" font-size="16.5" fill="#97ACB1">Clean Architecture with feature modules.</text><text x="36" y="215" class="sans" font-size="16.5" fill="#97ACB1">@Observable and BLoC for state, actors</text><text x="36" y="240" class="sans" font-size="16.5" fill="#97ACB1">and async/await for safe concurrency.</text>
